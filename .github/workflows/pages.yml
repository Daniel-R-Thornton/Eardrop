name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # eslint-config-airbnb pins eslint ^7/^8 while the repo is on eslint 10;
      # local installs resolve with legacy peer handling, match that here.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_BASE: /Eardrop/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # PR runs only need the build/typecheck signal above — deploying a PR's
    # build to production Pages would be wrong (and the github-pages
    # environment isn't set up to authorize it for arbitrary branches).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
